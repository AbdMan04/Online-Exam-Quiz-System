spring.application.name=quiz-system

# ---- MySQL (development / demo) ----
# Override credentials with environment variables DB_USERNAME / DB_PASSWORD,
# or put them in application-local.properties (git-ignored).
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# keep the session id in a cookie, never in the URL
server.servlet.session.tracking-modes=cookie
