<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar(null)}"></header>
<main class="card narrow">
    <h1>Create an account</h1>
    <p class="alert error" th:if="${error}" th:text="${error}" id="error"></p>
    <form th:action="@{/register}" method="post">
        <label>Full name
            <input type="text" name="name" th:value="${name}" required autofocus>
        </label>
        <label>Email
            <input type="email" name="email" th:value="${email}" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
            <small class="muted">8-20 characters, at least one letter and one digit.</small>
        </label>
        <button type="submit" class="btn">Register</button>
    </form>
    <p class="muted">Already registered? <a th:href="@{/login}">Log in</a></p>
</main>
</body>
</html>
