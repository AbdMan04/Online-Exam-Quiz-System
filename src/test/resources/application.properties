# Test configuration: shadows src/main/resources/application.properties on the test classpath,
# so every test (Maven or IntelliJ) runs on an in-memory H2 database - no MySQL needed.
spring.application.name=quiz-system-test
spring.datasource.url=jdbc:h2:mem:quizdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
